<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Care Request | CareNest</title>
    <link rel="icon" href="assets/images/website-logo.png" type="image/png">
    <meta name="description" content="Request a personalized care consultation with CareNest.">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* Contact Page Specific Styles */
        
        .contact-hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .contact-hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .contact-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(248,249,250,1) 0%, rgba(248,249,250,0.7) 100%);
            z-index: 1;
        }

        .contact-content {
            position: relative;
            z-index: 2;
            padding-top: 5rem;
        }

        /* Multi-step Form */
        .form-card {
            background: var(--bg-surface-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        .form-step {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .form-step.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .step-indicator {
            display: flex;
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .step-dot {
            height: 4px;
            flex-grow: 1;
            background: var(--border-light);
            border-radius: 2px;
            transition: var(--transition-smooth);
        }

        .step-dot.active {
            background: var(--accent-champagne);
        }

        .form-check-custom {
            margin-bottom: 1rem;
        }

        .form-check-custom input[type="radio"] {
            display: none;
        }

        .form-check-label-custom {
            display: block;
            padding: 1.5rem;
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition-fast);
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .form-check-custom input[type="radio"]:checked + .form-check-label-custom {
            border-color: var(--accent-champagne);
            background: rgba(230, 216, 195, 0.05);
            color: var(--accent-champagne);
        }

        .form-control-custom {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-primary);
            padding: 1rem 0;
            width: 100%;
            margin-bottom: 2rem;
            font-size: 1.1rem;
            transition: var(--transition-fast);
        }

        .form-control-custom:focus {
            outline: none;
            border-color: var(--accent-champagne);
        }

        .form-control-custom::placeholder {
            color: var(--text-secondary);
        }

        /* Trust Section */
        .trust-section {
            padding: 8rem 0;
            background: var(--bg-surface);
            border-top: 1px solid var(--border-subtle);
        }

        .trust-card {
            text-align: center;
            padding: 2rem;
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            height: 100%;
            transition: var(--transition-smooth);
        }

        .trust-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-champagne);
        }

        .trust-icon {
            width: 60px;
            height: 60px;
            background: rgba(230, 216, 195, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: var(--accent-champagne);
        }

        @media (max-width: 768px) {
            .form-step .d-flex.justify-content-between {
                flex-direction: column;
                gap: 1rem;
            }
            .form-step .d-flex.justify-content-between > * {
                width: 100%;
                justify-content: center;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- Consultation Intro & Form -->
    <section class="contact-hero">
        <img src="assets/images/companion_care.jpg" alt="Care Consultation" class="contact-hero-bg">
        <div class="contact-overlay"></div>
        
        <div class="container contact-content">
            <div class="row align-items-center g-5 justify-content-center">
                
                <div class="col-lg-6 gs-reveal" style="transition-delay: 0.2s">
                    <div class="form-card">
                        <div class="step-indicator">
                            <div class="step-dot active" id="dot1"></div>
                            <div class="step-dot" id="dot2"></div>
                            <div class="step-dot" id="dot3"></div>
                            <div class="step-dot" id="dot4"></div>
                        </div>

                        <form id="careRequestForm" onsubmit="event.preventDefault(); showSuccess();">
                            <!-- Step 1 -->
                            <div class="form-step active" id="step1">
                                <h3 class="mb-4">Who needs care?</h3>
                                <div class="row g-3">
                                    <div class="col-sm-6">
                                        <div class="form-check-custom">
                                            <input type="radio" name="who" id="who1" value="myself">
                                            <label class="form-check-label-custom" for="who1">Myself</label>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <div class="form-check-custom">
                                            <input type="radio" name="who" id="who2" value="parent" checked>
                                            <label class="form-check-label-custom" for="who2">Parent</label>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <div class="form-check-custom">
                                            <input type="radio" name="who" id="who3" value="grandparent">
                                            <label class="form-check-label-custom" for="who3">Grandparent</label>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <div class="form-check-custom">
                                            <input type="radio" name="who" id="who4" value="partner">
                                            <label class="form-check-label-custom" for="who4">Partner</label>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <div class="form-check-custom">
                                            <input type="radio" name="who" id="who5" value="child">
                                            <label class="form-check-label-custom" for="who5">Child</label>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <div class="form-check-custom">
                                            <input type="radio" name="who" id="who6" value="other">
                                            <label class="form-check-label-custom" for="who6">Other</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="d-flex justify-content-between mt-4">
                                    <a href="index.html" class="btn-outline-custom border-0 text-decoration-none d-inline-flex align-items-center">&larr; Back to Home</a>
                                    <button type="button" class="btn-primary-custom" onclick="nextStep(1, 2)">Next Step &rarr;</button>
                                </div>
                            </div>

                            <!-- Step 2 -->
                            <div class="form-step" id="step2">
                                <h3 class="mb-4">What type of support?</h3>
                                <div class="row g-3">
                                    <div class="col-sm-6">
                                        <div class="form-check-custom">
                                            <input type="radio" name="support" id="sup1" value="companion" checked>
                                            <label class="form-check-label-custom" for="sup1">Companion Care</label>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <div class="form-check-custom">
                                            <input type="radio" name="support" id="sup2" value="personal">
                                            <label class="form-check-label-custom" for="sup2">Personal Care</label>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <div class="form-check-custom">
                                            <input type="radio" name="support" id="sup3" value="senior">
                                            <label class="form-check-label-custom" for="sup3">Senior Care</label>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <div class="form-check-custom">
                                            <input type="radio" name="support" id="sup4" value="respite">
                                            <label class="form-check-label-custom" for="sup4">Respite Care</label>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <div class="form-check-custom">
                                            <input type="radio" name="support" id="sup5" value="dementia">
                                            <label class="form-check-label-custom" for="sup5">Dementia Support</label>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <div class="form-check-custom">
                                            <input type="radio" name="support" id="sup6" value="recovery">
                                            <label class="form-check-label-custom" for="sup6">Recovery Support</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="d-flex justify-content-between mt-4">
                                    <button type="button" class="btn-outline-custom border-0" onclick="nextStep(2, 1)">&larr; Back</button>
                                    <button type="button" class="btn-primary-custom" onclick="nextStep(2, 3)">Next Step &rarr;</button>
                                </div>
                            </div>

                            <!-- Step 3 -->
                            <div class="form-step" id="step3">
                                <h3 class="mb-4">Preferred schedule?</h3>
                                <div class="row g-3">
                                    <div class="col-sm-6">
                                        <div class="form-check-custom">
                                            <input type="radio" name="schedule" id="sch1" value="weekdays" checked>
                                            <label class="form-check-label-custom" for="sch1">Weekdays</label>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <div class="form-check-custom">
                                            <input type="radio" name="schedule" id="sch2" value="weekends">
                                            <label class="form-check-label-custom" for="sch2">Weekends</label>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <div class="form-check-custom">
                                            <input type="radio" name="schedule" id="sch3" value="full_time">
                                            <label class="form-check-label-custom" for="sch3">Full Time</label>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <div class="form-check-custom">
                                            <input type="radio" name="schedule" id="sch4" value="part_time">
                                            <label class="form-check-label-custom" for="sch4">Part Time</label>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <div class="form-check-custom">
                                            <input type="radio" name="schedule" id="sch5" value="flexible">
                                            <label class="form-check-label-custom text-center" for="sch5">Flexible / Not Sure</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="d-flex justify-content-between mt-4">
                                    <button type="button" class="btn-outline-custom border-0" onclick="nextStep(3, 2)">&larr; Back</button>
                                    <button type="button" class="btn-primary-custom" onclick="nextStep(3, 4)">Next Step &rarr;</button>
                                </div>
                            </div>

                            <!-- Step 4 -->
                            <div class="form-step" id="step4">
                                <h3 class="mb-4">Your details</h3>
                                <input type="text" class="form-control-custom" placeholder="Full Name" required>
                                <input type="email" class="form-control-custom" placeholder="Email Address" required>
                                <input type="tel" class="form-control-custom" placeholder="Phone Number" required>
                                <textarea class="form-control-custom" rows="2" placeholder="Additional details (optional)"></textarea>
                                
                                <div class="d-flex justify-content-between mt-4">
                                    <button type="button" class="btn-outline-custom border-0" onclick="nextStep(4, 3)">&larr; Back</button>
                                    <button type="submit" class="btn-primary-custom border-0 bg-white text-dark">Request Care Consultation</button>
                                </div>
                            </div>

                            <!-- Success Message -->
                            <div class="form-step text-center py-5" id="stepSuccess">
                                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--accent-sage)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-4"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                                <h3>Request Received</h3>
                                <p class="text-secondary">Thank you for reaching out. A CareNest specialist will contact you shortly.</p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/animations.js"></script>
    <script>
        // Multi-step form logic
        function nextStep(current, next) {
            document.getElementById('step' + current).classList.remove('active');
            document.getElementById('step' + next).classList.add('active');
            
            // Update dots
            if(next <= 4) {
                document.querySelectorAll('.step-dot').forEach((dot, index) => {
                    if(index < next) {
                        dot.classList.add('active');
                    } else {
                        dot.classList.remove('active');
                    }
                });
            }
        }

        function showSuccess() {
            document.getElementById('step4').classList.remove('active');
            document.getElementById('stepSuccess').classList.add('active');
            document.querySelector('.step-indicator').style.display = 'none';
        }

        // Auto-select based on URL param
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const serviceType = urlParams.get('service');
            if (serviceType) {
                const radio = document.querySelector(`input[name="support"][value="${serviceType}"]`);
                if (radio) {
                    radio.checked = true;
                }
            }
        });
    </script>
</body>
</html>
