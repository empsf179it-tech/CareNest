<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | CareNest</title>
    <link rel="icon" href="assets/images/website-logo.png" type="image/png">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .error-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            background: var(--bg-dark);
            overflow: hidden;
        }

        #three-canvas-404 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .error-content {
            position: relative;
            z-index: 1;
            background: var(--bg-surface-glass);
            padding: 4rem;
            border-radius: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-light);
        }

        .error-code {
            font-family: var(--font-heading);
            font-size: 8rem;
            color: var(--accent-champagne);
            line-height: 1;
            margin-bottom: 1rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <section class="error-section">
        <div id="three-canvas-404"></div>
        
        <div class="error-content gs-reveal">
            <div class="error-code">404</div>
            <h1 class="display-5 mb-4">Lost on the Way?</h1>
            <p class="lead text-secondary mb-5">The page you're looking for isn't here, but we're still here to help.</p>
            <a href="index.html" class="btn-primary-custom">Return to CareNest &rarr;</a>
        </div>
    </section>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            gsap.fromTo('.error-content', { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 1, ease: 'power3.out' });

            const container = document.getElementById('three-canvas-404');
            if (!container) return;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 10;

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // Create abstract nest/orb
            const geometry = new THREE.IcosahedronGeometry(3, 1);
            const material = new THREE.MeshBasicMaterial({
                color: 0xe6d8c3,
                wireframe: true,
                transparent: true,
                opacity: 0.15
            });
            const orb = new THREE.Mesh(geometry, material);
            scene.add(orb);

            // Particles
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = 200;
            const posArray = new Float32Array(particlesCount * 3);
            
            for(let i = 0; i < particlesCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 20;
            }
            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particlesMaterial = new THREE.PointsMaterial({
                size: 0.05,
                color: 0xe6d8c3,
                transparent: true,
                opacity: 0.5
            });
            const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particlesMesh);

            const animate = () => {
                requestAnimationFrame(animate);
                orb.rotation.x += 0.002;
                orb.rotation.y += 0.003;
                particlesMesh.rotation.y -= 0.001;
                renderer.render(scene, camera);
            };
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        });
    </script>
</body>
</html>
